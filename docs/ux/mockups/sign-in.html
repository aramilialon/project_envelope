<!doctype html>
<!--
  Interactive mockup of sign-in (#70, docs/design.md "User interface"): the app owns no
  credentials of its own (OIDC Authorization Code against Keycloak, docs/design.md
  "Authentication with Keycloak"), so this screen is deliberately minimal — a redirect,
  not a login form. The three states below are what the app actually shows around that
  redirect: idle, in flight, and back with an error. Open it in a browser; no build step,
  no dependencies except the Bricolage Grotesque and Figtree fonts from Google Fonts (the app itself self-hosts its
  fonts). The UI copy is the Italian translation; English stays the source language.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>envelope - sign-in mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Figtree:wght@400..700&display=swap">
<style>
[hidden]{display:none!important}
html,body{margin:0}
:root{
  --desk:#E4ECF5; --paper:#FFFFFF; --paper-2:#F2F6FB;
  --ink:#13263A; --ink-2:#3E5267; --muted:#627589;
  --rule:#D2DDE9; --rule-soft:#E8EEF5; --rule-strong:#13263A;
  --pen:#1E5A92; --pen-ink:#FFFFFF; --pen-soft:#DCE8F5;
  --band:#173B60; --band-ink:#FFFFFF; --band-2:#24507D; --band-muted:#B4C8DD;
  --bar:#79AADB; --spent:#CBD6E1;
  --amber:#DE9F2F; --amber-ink:#2E2104;
  --red:#C2412D; --red-ink:#FFFFFF; --red-text:#AE3826;
  --hatch:#DE9F2F; --hatch-bg:#FCF0D6; --hatch-ink:#3B2A07;
  --warn:#8A5A04;
  --font:'Figtree','Helvetica Neue',Arial,sans-serif;
  --display:'Bricolage Grotesque','Figtree','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --desk:#121417; --paper:#1A1D21; --paper-2:#20242A;
    --ink:#E8ECF1; --ink-2:#BDC4CD; --muted:#8B939E;
    --rule:#2D3137; --rule-soft:#23272C; --rule-strong:#BDC4CD;
    --pen:#8DBCEB; --pen-ink:#0A1A2B; --pen-soft:#1F3048;
    --band:#1D4570; --band-ink:#F2F6FA; --band-2:#2B5888; --band-muted:#B0C6DD;
    --bar:#4277AC; --spent:#383D45;
    --amber:#D19A35; --amber-ink:#1F1602;
    --red:#D9553F; --red-ink:#FFFFFF; --red-text:#F29C8C;
    --hatch:#D19A35; --hatch-bg:#3A2E14; --hatch-ink:#F7E3B5;
    --warn:#ECBA6A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#121417; --paper:#1A1D21; --paper-2:#20242A;
  --ink:#E8ECF1; --ink-2:#BDC4CD; --muted:#8B939E;
  --rule:#2D3137; --rule-soft:#23272C; --rule-strong:#BDC4CD;
  --pen:#8DBCEB; --pen-ink:#0A1A2B; --pen-soft:#1F3048;
  --band:#1D4570; --band-ink:#F2F6FA; --band-2:#2B5888; --band-muted:#B0C6DD;
  --bar:#4277AC; --spent:#383D45;
  --amber:#D19A35; --amber-ink:#1F1602;
  --red:#D9553F; --red-ink:#FFFFFF; --red-text:#F29C8C;
  --hatch:#D19A35; --hatch-bg:#3A2E14; --hatch-ink:#F7E3B5;
  --warn:#ECBA6A;
}

*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
button{font:inherit;color:inherit;cursor:pointer}

.tools{position:fixed;top:12px;left:12px;display:flex;gap:6px;z-index:10}
.tools button{border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:3px;padding:4px 8px;font-size:12px}
.tools button[aria-pressed="true"]{background:var(--pen-soft);border-color:var(--pen);color:var(--pen)}

.card{background:var(--paper);border:1px solid var(--rule);border-radius:3px;width:min(360px,100%);padding:40px 32px;text-align:center}
.mark{font-stretch:75%;font-weight:700;font-size:22px;letter-spacing:.2px;margin:0 0 6px}
.tag{color:var(--muted);font-size:13px;margin:0 0 32px}

.primary{width:100%;background:var(--pen);color:var(--pen-ink);border:none;border-radius:3px;padding:12px;font-weight:600;font-size:14px}
.primary:disabled{opacity:.6;cursor:default}
.primary .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--pen-ink);border-top-color:transparent;border-radius:50%;margin-inline-end:8px;vertical-align:-2px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.err{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb, var(--red) 10%, var(--paper));border:1px solid var(--red);border-radius:3px;padding:12px;text-align:start;margin-bottom:20px;color:var(--red-text)}
.err svg{flex:none;margin-top:1px}
.err p{margin:0;color:var(--ink)}
.err .code{display:block;color:var(--muted);font-size:12px;margin-top:2px}

.foot{margin-top:24px;color:var(--muted);font-size:12px}
.foot a{color:inherit}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Mariner restyle (shared with the budget month): sentence-case labels, the display face for
   titles and big figures, softer corners, and the navigation band that replaces the sidebar. */
h1,h2,h3,h4,.big{font-family:var(--display);font-stretch:92%;letter-spacing:-.3px}
.where,.sec h5,.ledger h5,.th,.lbl,.tag{font-stretch:100%}
.where,.sec h5,.ledger h5{text-transform:none;letter-spacing:0;font-size:13px}
.btn{border-radius:10px}
.amt-cell,.amt-cell.cash,.amt-cell.credit,.amt-cell.short{border-radius:7px}
.cover,.preview,.gstats{border-radius:12px}
.field select,.money-in,.cover select{border-radius:10px}
.scroller{border-radius:16px}
.band2{grid-column:1 / -1;display:flex;align-items:center;gap:22px;padding:14px 30px;background:var(--band);color:var(--band-ink)}
.band2 .brand2{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.3px}
.band2 .tnav{display:flex;gap:4px}
.band2 .tnav button{min-height:34px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--band-muted)}
.band2 .tnav button[aria-current]{background:var(--band-2);color:var(--band-ink);font-weight:600}
.band2 .ws2{margin-left:auto;display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--band-ink)}
.band2 .me2{border:0;background:transparent;color:var(--band-muted)}
</style>
</head>
<body>

<div class="tools" role="radiogroup" aria-label="Stato">
  <button type="button" data-state="idle" aria-pressed="true">Idle</button>
  <button type="button" data-state="pending" aria-pressed="false">Redirecting</button>
  <button type="button" data-state="error" aria-pressed="false">Errore</button>
</div>

<main class="card" aria-live="polite">
  <p class="mark" aria-hidden="true">envelope</p>

  <div id="view-idle">
    <p class="tag">Budget e portafoglio, sul tuo server.</p>
    <button type="button" class="primary" id="go">Accedi</button>
  </div>

  <div id="view-pending" hidden>
    <p class="tag">Reindirizzamento in corso…</p>
    <button type="button" class="primary" disabled aria-busy="true">
      <span class="spin" aria-hidden="true"></span>Accesso in corso
    </button>
    <p class="sr-only" role="status">Reindirizzamento alla pagina di accesso</p>
  </div>

  <div id="view-error" hidden>
    <div class="err" role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 1 21h22L12 2Zm0 6 7 12H5l7-12Zm-1 4h2v5h-2v-5Zm0 6h2v2h-2v-2Z"/></svg>
      <p>Non è stato possibile completare l'accesso.<span class="code">invalid_state — la sessione di accesso non è valida, riprova</span></p>
    </div>
    <button type="button" class="primary" id="retry">Riprova</button>
  </div>

  <p class="foot">Un problema? <a href="#">Scrivi all'amministratore del tuo server</a>.</p>
</main>

<script>
const views = { idle: '#view-idle', pending: '#view-pending', error: '#view-error' };
const buttons = document.querySelectorAll('.tools button');

function show(state) {
  for (const [key, sel] of Object.entries(views)) {
    document.querySelector(sel).hidden = key !== state;
  }
  for (const b of buttons) b.setAttribute('aria-pressed', String(b.dataset.state === state));
}

for (const b of buttons) b.addEventListener('click', () => show(b.dataset.state));
document.getElementById('go').addEventListener('click', () => show('pending'));
document.getElementById('retry').addEventListener('click', () => show('pending'));

show('idle');
</script>
</body>
</html>
