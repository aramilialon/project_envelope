name: Security audit

# Token-free dependency audit (docs/how-to/work-with-the-agent-team.md, "Agents and CI"): runs
# `pnpm audit` weekly and on demand, and keeps one open issue listing what it finds. Fixing the
# findings is local work for the agent team, not something this workflow does.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Audit dependencies
        id: audit
        run: |
          set +e
          pnpm audit --audit-level=low > audit.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat audit.txt

      - name: Open or update the audit issue
        if: steps.audit.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Security audit: vulnerable dependencies"
          {
            echo "The weekly \`pnpm audit\` found vulnerable dependencies (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            echo '```'
            head -c 60000 audit.txt
            echo '```'
          } > body.md
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --label "type:chore" --body-file body.md
          fi
