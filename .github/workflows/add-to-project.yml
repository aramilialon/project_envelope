# Adds every new issue to the project board automatically, so it never falls
# behind (it did once: 64 items tracked out of 203 issues).
#
# Deliberately issues only, not pull requests: a pull request that closes an
# issue already on the board would get its own card with the same title,
# which reads as a duplicate (#230) — the linked issue's card already
# carries the work through the board and closes when the PR merges.
name: Add to project

on:
  issues:
    types: [opened]

permissions:
  issues: read

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    env:
      # The `secrets` context is not allowed inside `if:` conditions (only in
      # `env:`, `with:` and a few other fields); routing it through env here
      # is what lets the steps below check whether it's set.
      PROJECT_BOARD_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN }}
    steps:
      - name: Skip if PROJECT_BOARD_TOKEN is not configured yet
        if: ${{ env.PROJECT_BOARD_TOKEN == '' }}
        run: echo "::warning::PROJECT_BOARD_TOKEN is not set (see the how-to guide); skipping."

      - uses: actions/add-to-project@v2
        if: ${{ env.PROJECT_BOARD_TOKEN != '' }}
        with:
          project-url: https://github.com/users/aramilialon/projects/3
          github-token: ${{ env.PROJECT_BOARD_TOKEN }}
