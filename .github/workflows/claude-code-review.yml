name: Claude Code Review

on:
  # Opened or marked ready only, not on every push: the review costs tokens, and a pull request
  # is reviewed once (docs/how-to/work-with-the-agent-team.md, "Agents and CI").
  pull_request:
    types: [opened, ready_for_review]

jobs:
  claude-review:
    # Not on drafts; every other pull request gets one independent read.
    if: ${{ !github.event.pull_request.draft }}

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The review command's first step lets the model stop, without a word, on a pull request it
          # judges not to need a review; it did so on small and docs-only pull requests, so a skipped
          # review looked like one that found nothing (#618). The text after the command reaches the
          # model as the command's arguments: it may still skip a pull request, but it always says
          # why in one comment. The prompt is folded into one line so that it all stays the
          # command's arguments. The full output stays hidden (public repository).
          prompt: >-
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            Instructions for this repository, which take precedence over step 1 of the command:
            whenever you stop without reviewing, for any reason (closed, draft, already commented,
            or a change you judge not to need a review), post exactly one line with gh pr comment
            in the form "Not reviewed: <reason>", for example "Not reviewed: a one-line
            documentation fix that is obviously correct.". Never end without a comment on the
            pull request.
          # Read-only access to the pull request (the checkout is shallow, so the diff comes from
          # `gh pr diff`), plus posting its comments; no other shell commands.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

