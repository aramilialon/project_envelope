# Continuous integration: on every push to main and every pull request,
# install dependencies, check types, apply migrations against a real
# PostgreSQL, start a real Keycloak, and run the tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: envelope_test
          POSTGRES_PASSWORD: envelope_test
          POSTGRES_DB: envelope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U envelope_test -d envelope_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      # Used by apps/api: its own tests and the migration runner.
      DATABASE_URL: postgres://envelope_test:envelope_test@localhost:5432/envelope_test
      # Used by apps/api's Keycloak test helper to provision a throwaway realm per test run.
      KEYCLOAK_ADMIN_PASSWORD: envelope_test
    steps:
      - uses: actions/checkout@v7

      # Keycloak needs an explicit "start-dev" command, which the "services:" block cannot
      # pass, so it is started as a plain container instead of a service.
      - name: Start Keycloak
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD" \
            quay.io/keycloak/keycloak:26.0 start-dev

      - name: Wait for Keycloak
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/realms/master/.well-known/openid-configuration > /dev/null; then
              echo "Keycloak is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Keycloak did not become ready in time"
          docker logs keycloak
          exit 1

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # The pnpm cache is keyed on the lockfile, so it is enabled only once the lockfile exists.
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      # With a lockfile, CI installs exactly the locked versions and fails if the lockfile is
      # out of date. Without one (only before the first lockfile is committed), it resolves them.
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml is missing: installing without a lockfile"
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm typecheck
      - name: Apply database migrations
        run: pnpm --filter @envelope/api migrate

      # One named step per package and test kind (ADR 0007), instead of a single
      # "Run pnpm test": the job summary itself says where a failure is. Each step
      # runs even if an earlier one failed ("if: always()"), so a failure in
      # packages/core does not hide whether apps/api's own tests still pass; the
      # final step fails the job if any of them did not succeed.
      - name: Run pnpm test - packages/core - unit
        id: core_unit
        run: pnpm --filter @envelope/core test
      - name: Run pnpm test - apps/api - integration
        id: api_integration
        if: always()
        run: pnpm --filter @envelope/api test:integration
      - name: Run pnpm test - apps/api - smoke
        id: api_smoke
        if: always()
        run: pnpm --filter @envelope/api test:smoke
      - name: Check test results
        if: always()
        run: |
          if [ "${{ steps.core_unit.outcome }}" != "success" ] ||
             [ "${{ steps.api_integration.outcome }}" != "success" ] ||
             [ "${{ steps.api_smoke.outcome }}" != "success" ]; then
            echo "::error::At least one test step failed; see above."
            exit 1
          fi
