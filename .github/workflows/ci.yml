# Continuous integration: on every push to main and every pull request,
# install dependencies, check types, apply migrations against a real
# PostgreSQL and run the tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: envelope_test
          POSTGRES_PASSWORD: envelope_test
          POSTGRES_DB: envelope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U envelope_test -d envelope_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      # Used by apps/api: its own tests and the migration runner.
      DATABASE_URL: postgres://envelope_test:envelope_test@localhost:5432/envelope_test
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # The pnpm cache is keyed on the lockfile, so it is enabled only once the lockfile exists.
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      # With a lockfile, CI installs exactly the locked versions and fails if the lockfile is
      # out of date. Without one (only before the first lockfile is committed), it resolves them.
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml is missing: installing without a lockfile"
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm typecheck
      - name: Apply database migrations
        run: pnpm --filter @envelope/api migrate
      - run: pnpm test
