# Continuous integration: on every push to main and every pull request,
# install dependencies, check types and run the tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # In CI pnpm uses the lockfile as is and fails if it is out of date.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
