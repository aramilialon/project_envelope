# Continuous integration: on every push to main and every pull request,
# install dependencies, check types and run the tests. Split into three jobs that
# run in parallel: "unit" needs no services and covers packages/core, apps/web,
# packages/i18n and the development scripts; "integration" starts a real
# PostgreSQL and Keycloak for apps/api's own integration and smoke tests; "e2e"
# brings up a disposable environment (scripts/explore-env/, #536) on a
# PostgreSQL of its own and a Keycloak container, and runs apps/web's Playwright
# suite against it. The three test jobs wait only on
# the small "changes" job, which skips them for a documentation-only pull
# request, and not on each other, so a push is not held up by services that most
# of the test suite does not need.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Decides whether the application jobs below need to run. A pull request that
  # changes only documentation (every changed file is Markdown, anywhere in the
  # repository, or lives under docs/: mockups, screenshots, ADRs) skips them; the
  # decision is made from the files themselves, never from the title. Pushes to
  # main always run everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          echo "$files"
          code=$(printf '%s\n' "$files" | grep -Ev '(\.md$|^docs/)' | grep -c . || true)
          if [ -z "$files" ] || [ "$code" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Documentation-only change: application jobs skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # The pnpm cache is keyed on the lockfile, so it is enabled only once the lockfile exists.
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      # With a lockfile, CI installs exactly the locked versions and fails if the lockfile is
      # out of date. Without one (only before the first lockfile is committed), it resolves them.
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml is missing: installing without a lockfile"
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm typecheck

      # One named step per package and test kind (ADR 0007), instead of a single
      # "Run pnpm test": the job summary itself says where a failure is. Each step
      # runs even if an earlier one failed ("if: always()"), so a failure in
      # packages/core does not hide whether apps/web's own tests still pass; the
      # final step fails the job if any of them did not succeed.
      - name: Run pnpm test - packages/core - unit
        id: core_unit
        run: pnpm --filter @envelope/core test
      - name: Run pnpm test - apps/web - unit
        id: web_unit
        if: always()
        run: pnpm --filter @envelope/web test
      - name: Run pnpm test - packages/i18n - catalog completeness
        id: i18n_complete
        if: always()
        run: pnpm --filter @envelope/i18n test
      - name: Run pnpm test - scripts - unit
        id: scripts_unit
        if: always()
        run: pnpm --filter @envelope/scripts test
      - name: Check test results
        if: always()
        run: |
          if [ "${{ steps.core_unit.outcome }}" != "success" ] ||
             [ "${{ steps.web_unit.outcome }}" != "success" ] ||
             [ "${{ steps.i18n_complete.outcome }}" != "success" ] ||
             [ "${{ steps.scripts_unit.outcome }}" != "success" ]; then
            echo "::error::At least one test step failed; see above."
            exit 1
          fi

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: envelope_test
          POSTGRES_PASSWORD: envelope_test
          POSTGRES_DB: envelope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U envelope_test -d envelope_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      # Used by apps/api: its own tests and the migration runner.
      DATABASE_URL: postgres://envelope_test:envelope_test@localhost:5432/envelope_test
      # Used by apps/api's Keycloak test helper to provision a throwaway realm per test run.
      KEYCLOAK_ADMIN_PASSWORD: envelope_test
    steps:
      - uses: actions/checkout@v7

      # Keycloak needs an explicit "start-dev" command, which the "services:" block cannot
      # pass, so it is started as a plain container instead of a service.
      - name: Start Keycloak
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD" \
            quay.io/keycloak/keycloak:26.0 start-dev

      - name: Wait for Keycloak
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/realms/master/.well-known/openid-configuration > /dev/null; then
              echo "Keycloak is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Keycloak did not become ready in time"
          docker logs keycloak
          exit 1

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # The pnpm cache is keyed on the lockfile, so it is enabled only once the lockfile exists.
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      # With a lockfile, CI installs exactly the locked versions and fails if the lockfile is
      # out of date. Without one (only before the first lockfile is committed), it resolves them.
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml is missing: installing without a lockfile"
            pnpm install --no-frozen-lockfile
          fi
      - name: Apply database migrations
        run: pnpm --filter @envelope/api migrate

      - name: Run pnpm test - apps/api - integration
        id: api_integration
        run: pnpm --filter @envelope/api test:integration
      - name: Run pnpm test - apps/api - smoke
        id: api_smoke
        if: always()
        run: pnpm --filter @envelope/api test:smoke
      - name: Check test results
        if: always()
        run: |
          if [ "${{ steps.api_integration.outcome }}" != "success" ] ||
             [ "${{ steps.api_smoke.outcome }}" != "success" ]; then
            echo "::error::At least one test step failed; see above."
            exit 1
          fi

  # The Playwright suite (apps/web/e2e) against a disposable environment: its own database,
  # Keycloak realm, API and built web app (scripts/explore-env/, #536). Non-blocking for now
  # (continue-on-error): a failure shows on the run but does not fail the pull request, until
  # the job has proved stable on CI's runners.
  #
  # Disposable environments never use the shared server's port 5432: this job's only PostgreSQL
  # is a service on 55432, standing in for the `envelope-explore-postgres` container that
  # explore-env manages locally (EXPLORE_DATABASE_URL tells it so). Keycloak's start-dev keeps
  # its own data, so the job needs no other database.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    services:
      explore-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: explore_admin
          POSTGRES_PASSWORD: explore_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U explore_admin"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      # Throwaway literals, valid only on this runner.
      EXPLORE_DATABASE_URL: postgres://explore_admin:explore_ci@localhost:55432/postgres
      KEYCLOAK_ADMIN_PASSWORD: envelope_test
    steps:
      - uses: actions/checkout@v7

      # Keycloak needs an explicit "start-dev" command, which the "services:" block cannot
      # pass, so it is started as a plain container instead of a service.
      - name: Start Keycloak
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD" \
            quay.io/keycloak/keycloak:26.0 start-dev

      - name: Wait for Keycloak
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/realms/master/.well-known/openid-configuration > /dev/null; then
              echo "Keycloak is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Keycloak did not become ready in time"
          docker logs keycloak
          exit 1

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        run: pnpm --filter @envelope/web exec playwright install --with-deps chromium

      - name: Bring up a disposable environment
        run: |
          pnpm --filter @envelope/scripts explore:up -- --root "$RUNNER_TEMP/explore"
          echo "E2E_MANIFEST=$(ls "$RUNNER_TEMP"/explore/*/manifest.json)" >> "$GITHUB_ENV"

      - name: Run pnpm test:e2e - apps/web - against the disposable environment
        run: pnpm --filter @envelope/web test:e2e

      - name: Show the environment's logs
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/explore/*/*.log; do
            echo "::group::$log"
            tail -n 200 "$log"
            echo "::endgroup::"
          done

      # Playwright keeps a trace of every test it retried (trace: "on-first-retry").
      - name: Upload the Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Bring the environment down
        if: always() && env.E2E_MANIFEST != ''
        run: pnpm --filter @envelope/scripts explore:down -- "$E2E_MANIFEST"
